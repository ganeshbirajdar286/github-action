### "needs" specifies the dependencies for a job. It allows you to define which jobs must complete successfully before the current job can run. This is useful for creating complex workflows where certain tasks depend on the results of others.


name: workflow with dependencies
on:
  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        run: echo "This is Job 1"

  job2:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Step 2
        run: echo "This is Job 2, which depends on Job 1"
  job3:
    needs:
      - job1
      - job2
    runs-on: ubuntu-latest
    steps:
      - name: Step 3
        run: echo "This is Job 3, which depends on Job 2"